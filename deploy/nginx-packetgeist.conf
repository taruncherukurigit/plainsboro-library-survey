# packetgeist.tarunc.com — second vhost on the existing DMZ container.
#
# This sits alongside the existing cherwood site. Both listen on port 80;
# nginx picks between them by server_name, and cloudflared passes the Host
# header through from the tunnel. No new port, no new container, no new
# FortiGate policy — the DMZ→Internet ACCEPT rule from the Cherwood build
# already covers the tunnel's outbound connection.
#
# Install:
#   cp nginx-packetgeist.conf /etc/nginx/sites-available/packetgeist
#   ln -s /etc/nginx/sites-available/packetgeist /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name packetgeist.tarunc.com;

    root /var/www/packetgeist;
    index index.html;

    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # The page loads webfonts from Google and nothing else.
    add_header Content-Security-Policy
        "default-src 'self'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data:; \
         script-src 'self' 'unsafe-inline'; \
         frame-ancestors 'self'; \
         base-uri 'self'" always;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json text/csv image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(pdf|xlsx|csv|png|netspu)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/packetgeist.access.log;
    error_log  /var/log/nginx/packetgeist.error.log;
}
